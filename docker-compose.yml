services:
  api:
    build: .
    ports: ["5080:8080"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: ${ConnectionStrings__Database}
      Redis__ConnectionString: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
